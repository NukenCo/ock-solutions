<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>OCK Solutions · Acesso restrito</title>
<style>
@font-face{font-family:Inter;src:url('/assets/Inter-Regular.ttf');font-weight:400}
@font-face{font-family:Inter;src:url('/assets/Inter-Medium.ttf');font-weight:500}
:root{--bg:#f3efe6;--text:#07172a;--text-muted:#07172abf;--border:#07172a4d;--accent:#b38600;--error:#a3301c;--button-text:#f3efe6}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px 16px}
main{width:100%;max-width:380px}
img{display:block;margin-bottom:56px}
h1{font-size:32px;font-weight:400;letter-spacing:-.045em;line-height:1.12;margin:0 0 12px}
p{margin:0 0 36px;color:var(--text-muted);font-size:15px;line-height:1.5;letter-spacing:-.02em}
label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:10px}
input{width:100%;font:inherit;font-size:16px;color:var(--text);background:transparent;border:0;border-bottom:1px solid var(--border);padding:10px 0;border-radius:0}
input:focus{outline:none;border-bottom-color:var(--accent)}
button{margin-top:32px;width:100%;font:inherit;font-size:14px;font-weight:500;color:var(--button-text);background:var(--text);border:0;border-radius:999px;padding:14px 20px;cursor:pointer}
button:hover{background:#000}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.erro{margin:14px 0 0;color:var(--error);font-size:13px}
.erro[hidden]{display:none}
</style>
</head>
<body>
<main>
  <img src="/assets/ock-logo.svg" width="145" alt="OCK Solutions">
  <h1>Acesso restrito</h1>
  <p>Este projeto está em desenvolvimento. Digite a senha para continuar.</p>
  <form method="post" action="/entrar">
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required autofocus aria-describedby="erro">
    <input type="hidden" name="next" id="next" value="/">
    <p class="erro" id="erro" role="alert" hidden>Senha incorreta. Tente novamente.</p>
    <button type="submit">Entrar</button>
  </form>
</main>
<script>
  var q = new URLSearchParams(location.search);
  if (q.get('next')) document.getElementById('next').value = q.get('next');
  if (q.get('erro')) document.getElementById('erro').hidden = false;
</script>
</body>
</html>
